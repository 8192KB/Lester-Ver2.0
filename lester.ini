# Lester 설정 파일
#
# 이 파일을 Lester-Ver2.0.exe 와 같은 폴더에 두면 자동으로 읽습니다.
# 값을 바꾼 뒤 프로그램을 다시 실행하면 적용됩니다.
# 줄 앞에 # 를 붙이면 그 줄은 무시됩니다(기본값 사용).
#
# 시작할 때 콘솔에 "[*] Config: ...\lester.ini (N개 항목)" 이 뜨면
# 정상적으로 읽힌 것입니다.


# ---- 입력이 씹힐 때 ----------------------------------------------

# 전체 속도 배율. 2 = 모든 대기를 두 배로. 가장 먼저 시도해볼 값.
# slow = 2

# 키를 누르고 있는 시간(초). 게임이 입력을 놓치면 키운다.
# key_hold = 0.035

# 키와 키 사이 간격(초).
# key_gap = 0.045


# ---- 판이 꼬일 때 ------------------------------------------------

# 게임 창이 활성 상태가 아니면 즉시 중단한다. 기본 켜짐.
# 끄면 알트탭 중에도 키를 계속 보내서 다른 창에 입력됩니다.
# focus_guard = 1

# 고정 대기 대신 화면 애니메이션이 실제로 끝나는 것을 보고 진행한다.
# PC 성능에 따라 대기가 자동으로 늘거나 줄어듭니다. (실험적)
# adaptive_wait = 1

# 한 칸을 확정한 뒤 다음 칸으로 넘어갈 때까지의 대기(초).
# keypad_confirm = 1.95
# voltage_confirm = 1.3

# 키패드 커서 정렬용 'w' 횟수. 기본 0 (정렬 안 함).
# 커서는 항상 맨 위에서 시작하고 다이얼은 순환하므로 건드리면 안 됩니다.
# home = 0

# 암기 패턴이 사라진 뒤 입력을 시작하기까지의 여유(초).
# phase_settle = 0.6

# 한 판이 끝나고 곧바로 다음 판이 이어질 때, 커서는 직전 판의 마지막 행에
# 남아 있습니다. 보통은 화면에서 커서를 직접 읽지만, 못 읽었을 때 직전 판의
# 기록을 재사용할 시간(초). 0 으로 두면 항상 맨 위에서 시작한다고 봅니다.
# carry_window = 25


# ---- 문제 신고용 -------------------------------------------------

# 1 로 두면 F5~F8 을 누를 때마다 debug/ 폴더에 화면을 저장합니다.
# debug = 1
